<div class="form-field space-y-1">
  <label for="{{ field.id_for_label }}" class="block text-sm font-medium">{{ field.label }}{% if field.field.required %} <span class="text-rose-600" aria-hidden="true">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p class="helptext">{{ field.help_text }}</p>{% endif %}
  {{ field.errors }}
</div>
